# Cloudflare Pages Configuration for Next.js
# Documentation: https://developers.cloudflare.com/pages/

name = "ai-resume-portfolio"
compatibility_date = "2024-01-01"

# Pages build output directory
pages_build_output_dir = ".vercel/output/static"

# ======================
# R2 Bucket Bindings (Optional - set up later)
# ======================
# [[r2_buckets]]
# binding = "RESUME_BUCKET"
# bucket_name = "ai-resume-storage"

# ======================
# KV Namespace Bindings (Optional - set up later)
# ======================
# [[kv_namespaces]]
# binding = "RESUME_CACHE"
# id = "your-kv-namespace-id"

# ======================
# D1 Database Bindings (Optional - set up later)
# ======================
# [[d1_databases]]
# binding = "DB"
# database_name = "ai-resume-db"
# database_id = "your-d1-database-id"

# ======================
# Environment Variables
# ======================
[vars]
NODE_ENV = "production"

# ======================
# Preview Environment
# ======================
[env.preview]
vars = { NODE_ENV = "preview" }

# ======================
# Production Environment
# ======================
[env.production]
vars = { NODE_ENV = "production" }
